name: Application Build

on:
  push:
    branches: [main]
    paths:
      - 'services/core-api/**'
      - 'frontend/**'
      - 'contracts/**'
      - 'tools/**'
      - '.github/workflows/application-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/core-api/**'
      - 'frontend/**'
      - 'contracts/**'
      - 'tools/**'
      - '.github/workflows/application-build.yml'

permissions:
  contents: read

jobs:
  core-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - name: Checkout
        # actions/checkout@v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Set up Java
        # actions/setup-java@v5.6.0
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        # MokaEmulatorClientIntegrationTest spawns tools/moka-emulator as a real
        # `python3 -m m4trust_moka_emulator` subprocess, so `mvnw verify` needs an
        # interpreter on PATH. Pin it here instead of relying on the runner image.
        # actions/setup-python@v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and test Core API
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        # actions/checkout@v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Set up Node.js
        # actions/setup-node@v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
      - name: Check committed API types without rewriting them
        run: npm run generate:api:check
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend formatting
        run: npm run format:check
      - name: Run frontend unit tests
        run: npm run test
      - name: Type-check and build frontend without rewriting generated types
        run: npm run build:check

  local-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install mock worker test dependencies
        run: python -m pip install -r tools/mock-ai-worker/requirements-dev.txt
      - name: Run mock worker critical boundary tests
        run: PYTHONPATH=tools/mock-ai-worker/src python -m pytest tools/mock-ai-worker/tests
      - name: Run Moka emulator critical boundary tests
        run: PYTHONPATH=tools/moka-emulator/src python -m unittest discover -s tools/moka-emulator/tests -p 'test_*.py' -v
