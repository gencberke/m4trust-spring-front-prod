name: Repository Hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Set up Python
        # actions/setup-python@v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check Markdown references
        run: python3 scripts/check-markdown-links.py
      - name: Prove repository-map idempotence and freshness
        run: |
          python3 scripts/generate-repo-map.py
          first="$(mktemp)"
          cp docs/agent/repo-map.md "$first"
          python3 scripts/generate-repo-map.py
          cmp -s "$first" docs/agent/repo-map.md
          git diff --exit-code -- docs/agent/repo-map.md
